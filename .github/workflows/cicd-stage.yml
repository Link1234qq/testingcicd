name: CI/CD stage

on:
  push:
    branches: [main]

jobs:
  run-ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  docker-build:
    name: Docker build
    uses: ./.github/workflows/docker-build.yml
    needs: run-ci

  infra-stage:
    name: Infra stage
    uses: ./.github/workflows/infra.yml
    needs: docker-build
    with:
      env: stage

  deploy-stage:
    name: Deploy stage
    uses: ./.github/workflows/deploy.yml
    needs: infra-stage
    with:
      env: stage
    secrets:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}


  e2e-and-performance-tests-stage:
    name: E2E and performance tests stage
    runs-on: ubuntu-latest
    needs: deploy-stage
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: E2E tests
        uses: ./.github/actions/run-tests/e2e

      - name: Performance tests
        uses: ./.github/actions/run-tests/performance

  notify-teams:
    name: Notify Teams (stage)
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - run-ci
      - docker-build
      - infra-stage
      - deploy-stage
      - e2e-and-performance-tests-stage
    steps:
      - name: Echo notification based on workflow status
        shell: bash
        env:
          RUN_CI_RESULT: ${{ needs['run-ci'].result }}
          DOCKER_BUILD_RESULT: ${{ needs['docker-build'].result }}
          INFRA_STAGE_RESULT: ${{ needs['infra-stage'].result }}
          DEPLOY_STAGE_RESULT: ${{ needs['deploy-stage'].result }}
          E2E_AND_PERF_STAGE_RESULT: ${{ needs['e2e-and-performance-tests-stage'].result }}
        run: |
          if [[ "${RUN_CI_RESULT}" == "success" && \
                "${DOCKER_BUILD_RESULT}" == "success" && \
                "${INFRA_STAGE_RESULT}" == "success" && \
                "${DEPLOY_STAGE_RESULT}" == "success" && \
                "${SMOKE_STAGE_RESULT}" == "success" && \
                "${E2E_STAGE_RESULT}" == "success" && \
                "${PERF_STAGE_RESULT}" == "success" ]]; then
            echo "TEAMS NOTIFICATION: CI/CD stage succeeded"
          else
            echo "TEAMS NOTIFICATION: CI/CD stage failed"
            echo "Results: run-ci=${RUN_CI_RESULT}, docker-build=${DOCKER_BUILD_RESULT}, infra-stage=${INFRA_STAGE_RESULT}, deploy-stage=${DEPLOY_STAGE_RESULT}, smoke-tests-stage=${SMOKE_STAGE_RESULT}, e2e-tests-stage=${E2E_STAGE_RESULT}, performance-tests-stage=${PERF_STAGE_RESULT}"
            exit 0
          fi
