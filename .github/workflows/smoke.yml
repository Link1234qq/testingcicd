# Reusable workflow: optional smoke test for an environment endpoint
name: Smoke test

on:
  workflow_call:
    inputs:
      name:
        description: Display name for the smoke test
        required: true
        type: string
      url:
        description: Healthcheck URL; if empty the check is skipped
        required: false
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ inputs.name }}
    runs-on: ubuntu-latest
    steps:
      - name: Smoke test endpoint
        shell: bash
        run: |
          if [ -z "${{ inputs.url }}" ]; then
            echo "Healthcheck URL is not set. Skipping."
            exit 0
          fi

          echo "Checking ${{ inputs.url }}"
          curl -fsSL "${{ inputs.url }}"

