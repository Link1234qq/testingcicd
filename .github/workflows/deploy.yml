# Reusable workflow: deploy to Kubernetes for one environment
name: Deploy to Kubernetes

on:
  workflow_call:
    inputs:
      env:
        description: Environment name (dev, stage, prod)
        required: true
        type: string
    secrets:
      KUBE_CONFIG:
        description: Kubeconfig for cluster access
        required: true
      REGISTRY_PASSWORD:
        description: Container registry password for image pull
        required: false

jobs:
  deploy:
    name: deploy-${{ inputs.env }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    env:
      ENV_NAME: ${{ inputs.env }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}-${{ inputs.env }}
      KUBECONFIG: ${{ secrets.KUBE_CONFIG }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Kubernetes
        uses: ./.github/actions/deploy-k8s
        with:
          env: ${{ inputs.env }}
