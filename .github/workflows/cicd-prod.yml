name: CI/CD prod

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  run-ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  docker-build:
    name: Docker build
    uses: ./.github/workflows/docker-build.yml
    needs: run-ci

  infra-prod:
    name: Infra prod
    uses: ./.github/workflows/infra.yml
    needs: docker-build
    with:
      env: prod

  regression-tests-prod:
    name: Regression tests prod
    uses: ./.github/actions/run-tests/regression
    needs: infra-prod

  deploy-prod:
    name: Deploy prod
    # Prod approvals: deploy.yml sets environment: ${{ inputs.env }} on the deploy job, so branch/env
    # protection rules (e.g. required reviewers on "prod") still apply when env is prod.
    uses: ./.github/workflows/deploy.yml
    needs: regression-tests-prod
    with:
      env: prod
    secrets:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
