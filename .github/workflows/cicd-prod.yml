name: CI/CD prod

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  run-ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  docker-build:
    name: Docker build
    uses: ./.github/workflows/docker-build.yml
    needs: run-ci

  infra-prod:
    name: Infra prod
    uses: ./.github/workflows/infra.yml
    needs: docker-build
    with:
      env: prod

  tests-prod:
    name: Tests prod (post-infra)
    runs-on: ubuntu-latest
    needs: infra-prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download build artifacts
        run: |
          echo "Downloading build artifacts"

      - name: Regression tests
        uses: ./.github/actions/run-tests/regression

      - name: Smoke tests
        uses: ./.github/actions/run-tests/smoketests

      - name: E2E tests
        uses: ./.github/actions/run-tests/e2e

  deploy-prod:
    name: Deploy prod
    # Prod approvals: deploy.yml sets environment: ${{ inputs.env }} on the deploy job, so branch/env
    # protection rules (e.g. required reviewers on "prod") still apply when env is prod.
    uses: ./.github/workflows/deploy.yml
    needs: tests-prod
    with:
      env: prod
    secrets:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
  
  performance-tests-prod:
    name: Performance tests prod (post-deploy)
    runs-on: ubuntu-latest
    needs: infra-prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download build artifacts
        run: |
          echo "Downloading build artifacts"

      - name: Performance tests
        uses: ./.github/actions/run-tests/performance


  notify-teams:
    name: Notify Teams (prod)
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - run-ci
      - docker-build
      - infra-prod
      - tests-prod
      - deploy-prod
    steps:
      - name: Echo notification based on workflow status
        shell: bash
        env:
          RUN_CI_RESULT: ${{ needs['run-ci'].result }}
          DOCKER_BUILD_RESULT: ${{ needs['docker-build'].result }}
          INFRA_PROD_RESULT: ${{ needs['infra-prod'].result }}
          TESTS_PROD_RESULT: ${{ needs['tests-prod'].result }}
          DEPLOY_PROD_RESULT: ${{ needs['deploy-prod'].result }}
        run: |
          if [[ "${RUN_CI_RESULT}" == "success" && \
                "${DOCKER_BUILD_RESULT}" == "success" && \
                "${INFRA_PROD_RESULT}" == "success" && \
                "${REGRESSION_TESTS_PROD_RESULT}" == "success" && \
                "${DEPLOY_PROD_RESULT}" == "success" ]]; then
            echo "TEAMS NOTIFICATION: CI/CD prod succeeded"
          else
            echo "TEAMS NOTIFICATION: CI/CD prod failed"
            echo "Results: run-ci=${RUN_CI_RESULT}, docker-build=${DOCKER_BUILD_RESULT}, infra-prod=${INFRA_PROD_RESULT}, regression-tests-prod=${REGRESSION_TESTS_PROD_RESULT}, deploy-prod=${DEPLOY_PROD_RESULT}"
            exit 0
          fi
