# Full CI/CD pipeline: Docker app → infra → deploy to K8s per env

name: ci-cd

on:
  push:
    branches:
      - develop
      - 'feature/*'
  pull_request:
    types: [opened, synchronize, reopened, closed]

env:
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}
  CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}

jobs:
  # --- CI: always run (build + test) ---
  call-ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # --- CD: only on merge to main (pull_request merged) — build image then sequential promotion with infra before each deploy ---
  docker-build:
    name: Docker build
    uses: ./.github/workflows/docker-build.yml
    needs: [call-ci]
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    secrets: inherit

  infra-dev:
    name: Infra dev
    uses: ./.github/workflows/infra.yml
    needs: [docker-build]
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    with:
      env: dev
    secrets: inherit

  deploy-dev:
    name: Deploy dev
    uses: ./.github/workflows/deploy.yml
    needs: [infra-dev]
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    with:
      env: dev
    secrets: inherit

  infra-stage:
    name: Infra stage
    uses: ./.github/workflows/infra.yml
    needs: [deploy-dev]
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    with:
      env: stage
    secrets: inherit

  deploy-stage:
    name: Deploy stage
    uses: ./.github/workflows/deploy.yml
    needs: [infra-stage]
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    with:
      env: stage
    secrets: inherit

  infra-prod:
    name: Infra prod
    uses: ./.github/workflows/infra.yml
    needs: [deploy-stage]
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    with:
      env: prod
    secrets: inherit

  deploy-prod:
    name: Deploy prod
    uses: ./.github/workflows/deploy.yml
    needs: [infra-prod]
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    with:
      env: prod
    secrets: inherit
