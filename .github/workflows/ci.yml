# Reusable workflow: CI (build & tests). Called from main workflows.
name: CI

on:
  workflow_call:

jobs:
  ci:
    name: ci - build & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build app
        uses: ./.github/actions/build-app

      - name: Run tests (unit/integration)
        uses: ./.github/actions/run-tests
