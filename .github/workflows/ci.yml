# Reusable workflow: CI (build & tests). Called from main workflows.
name: CI

on:
  workflow_call:

jobs:
  ci:
    name: ci - build & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect project type
        id: detect
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "node=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "node=false" >> "$GITHUB_OUTPUT"

      # Optional quality gates (run only when package.json exists)
      - name: Set up Node.js
        if: ${{ steps.detect.outputs.node == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: ${{ steps.detect.outputs.node == 'true' }}
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Static code analysis (typecheck)
        if: ${{ steps.detect.outputs.node == 'true' }}
        shell: bash
        run: |
          if npm run | grep -qE ' typecheck'; then
            npm run typecheck
          else
            echo "No typecheck script found. Skipping."
          fi

      - name: Lint
        if: ${{ steps.detect.outputs.node == 'true' }}
        shell: bash
        run: |
          if npm run | grep -qE ' lint'; then
            npm run lint
          else
            echo "No lint script found. Skipping."
          fi

      - name: Integration tests
        if: ${{ steps.detect.outputs.node == 'true' }}
        shell: bash
        run: |
          if npm run | grep -qE ' test:integration'; then
            npm run test:integration
          else
            echo "No test:integration script found. Skipping."
          fi

      - name: Regression tests
        uses: ./.github/actions/run-tests/regression

      - name: E2E tests
        uses: ./.github/actions/run-tests/e2e

      - name: Performance tests
        uses: ./.github/actions/run-tests/performance

      - name: Run unit tests
        uses: ./.github/actions/run-tests/unit

      - name: Smoke tests
        uses: ./.github/actions/run-tests/smoketests

      - name: Build app
        uses: ./.github/actions/build-app

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2.23.0
        if: always()
        with:
          files: '**/test-results/*.xml'
        continue-on-error: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: dist/
        continue-on-error: true

      - name: Add job summary
        run: |
          {
            echo "## CI Summary"
            echo "- Build: completed"
            echo "- Tests: completed"
          } >> "$GITHUB_STEP_SUMMARY"
