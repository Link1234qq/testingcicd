# Reusable workflow: CI (build & tests). Called from main workflows.
name: CI

on:
  workflow_call:

jobs:
  ci:
    name: ci - build & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        if: ${{ steps.detect.outputs.node == 'true' }}
        shell: bash
        run: |
          echo "Installing dependencies"

      - name: Integration tests
        uses: ./.github/actions/run-tests/integration

      - name: Regression tests
        uses: ./.github/actions/run-tests/regression

      - name: E2E tests
        uses: ./.github/actions/run-tests/e2e

      - name: Performance tests
        uses: ./.github/actions/run-tests/performance

      - name: Run unit tests
        uses: ./.github/actions/run-tests/unit

      - name: Smoke tests
        uses: ./.github/actions/run-tests/smoketests

      - name: Build app
        uses: ./.github/actions/build-app

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2.23.0
        if: always()
        with:
          files: '**/test-results/*.xml'
        continue-on-error: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: dist/
        continue-on-error: true

      - name: Add job summary
        run: |
          {
            echo "## CI Summary"
            echo "- Build: completed"
            echo "- Tests: completed"
          } >> "$GITHUB_STEP_SUMMARY"
