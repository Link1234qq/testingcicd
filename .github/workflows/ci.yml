# Reusable workflow: CI (build & tests). Called from main workflows.
name: CI

on:
  workflow_call:

jobs:
  pre-build-tests:
    name: pre-build tests
    runs-on: ubuntu-latest
    steps:
      - name: Unit tests
        uses: ./.github/actions/run-tests/unit
      
      - name: smoke tests
        uses: ./.github/actions/run-tests/smoketests

      - name: Add job summary
        run: |
          {
            echo "## Pre-build Tests Summary"
            echo "- Tests: completed"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        shell: bash
        run: |
          echo "Installing dependencies"

      - name: Build app
        uses: ./.github/actions/build-app

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: dist/
        continue-on-error: true

      - name: Add job summary
        run: |
          {
            echo "## Build Summary"
            echo "- Build: completed"
          } >> "$GITHUB_STEP_SUMMARY"

  integration-tests:
    name: integration tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: dist

      - name: Integration tests
        uses: ./.github/actions/run-tests/integration

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2.23.0
        if: always()
        with:
          files: '**/test-results/*.xml'
        continue-on-error: true

      - name: Add job summary
        run: |
          {
            echo "## Integration Tests Summary"
            echo "- Tests: completed"
          } >> "$GITHUB_STEP_SUMMARY"

  post-build-tests:
    name: post-build tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: E2E tests
        uses: ./.github/actions/run-tests/e2e

      - name: Performance tests
        uses: ./.github/actions/run-tests/performance

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2.23.0
        if: always()
        with:
          files: '**/test-results/*.xml'
        continue-on-error: true

      - name: Add job summary
        run: |
          {
            echo "## CI Summary"
            echo "- Tests: completed"
          } >> "$GITHUB_STEP_SUMMARY"
