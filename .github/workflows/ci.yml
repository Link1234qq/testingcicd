# Reusable workflow: CI — unit tests, build, integration tests (no E2E/perf without a deployed env).
name: CI

on:
  workflow_call:

jobs:
  pre-build-tests:
    name: pre-build tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Unit tests
        uses: ./.github/actions/run-tests/unit
      
      - name: Add job summary
        run: |
          {
            echo "## Pre-build Tests Summary"
            echo "- Tests: completed"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        shell: bash
        run: |
          echo "Installing dependencies"

      - name: Build app
        uses: ./.github/actions/build-app

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: dist/
        continue-on-error: true

      - name: Add job summary
        run: |
          {
            echo "## Build Summary"
            echo "- Build: completed"
          } >> "$GITHUB_STEP_SUMMARY"

  integration-tests:
    name: integration tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download build artifacts
        run: |
          echo "Downloading build artifacts"

      - name: Integration tests
        uses: ./.github/actions/run-tests/integration

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2.23.0
        if: always()
        with:
          files: '**/test-results/*.xml'
        continue-on-error: true

      - name: Add job summary
        run: |
          {
            echo "## Integration Tests Summary"
            echo "- Tests: completed"
          } >> "$GITHUB_STEP_SUMMARY"

