name: ci-prod

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  run-ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  docker-build:
    name: Docker build
    uses: ./.github/workflows/docker-build.yml
    needs: run-ci
    secrets: inherit

  infra-prod:
    name: Infra prod
    uses: ./.github/workflows/infra.yml
    needs: docker-build
    with:
      env: prod
    secrets: inherit

  deploy-prod:
    name: Deploy prod
    uses: ./.github/workflows/deploy.yml
    needs: infra-prod
    with:
      env: prod
    secrets: inherit

